version: '3.8'
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DB_HOST=db
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - KEYCLOAK_URL=${KEYCLOAK_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_JWKS_CACHE_TTL=${KEYCLOAK_JWKS_CACHE_TTL:-3600}
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DB_HOST=db
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - KEYCLOAK_URL=${KEYCLOAK_URL}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_JWKS_CACHE_TTL=${KEYCLOAK_JWKS_CACHE_TTL:-3600}
      - OPENSTACK_AUTH_URL=${OPENSTACK_AUTH_URL}
      - OPENSTACK_PROJECT_NAME=${OPENSTACK_PROJECT_NAME}
      - OPENSTACK_USERNAME=${OPENSTACK_USERNAME}
      - OPENSTACK_PASSWORD=${OPENSTACK_PASSWORD}
      - OPENSTACK_USER_DOMAIN_NAME=${OPENSTACK_USER_DOMAIN_NAME:-Default}
      - OPENSTACK_PROJECT_DOMAIN_NAME=${OPENSTACK_PROJECT_DOMAIN_NAME:-Default}
      - OPENSTACK_REGION_NAME=${OPENSTACK_REGION_NAME:-RegionOne}
      - OPENSTACK_IDENTITY_API_VERSION=${OPENSTACK_IDENTITY_API_VERSION:-3}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    command: celery -A src.celery_app:celery_app worker --loglevel=info