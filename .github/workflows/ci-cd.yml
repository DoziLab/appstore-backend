name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: uv sync --frozen
      - name: Checks
        run: |
          uv run ruff check src/ tests/
          uv run mypy src/
      - name: Tests
        env:
          REDIS_URL: redis://localhost:6379/0
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: test_db
          KEYCLOAK_URL: http://localhost:8080
          KEYCLOAK_REALM: test_realm
          KEYCLOAK_CLIENT_ID: test_client
          ENCRYPTION_KEY: dGVzdGtleXRlc3RrZXl0ZXN0a2V5dGVzdGtleXQ=
        run: uv run pytest tests/ --cov=src --cov-report=xml
      - uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: (github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dozilab/appstore-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: self-hosted
    environment: staging
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SERVER_SSH_KEY }}

      - name: Deploy api + celery-worker on Staging
        env:
          SERVER_HOST: ${{ secrets.STAGING_SERVER_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@$SERVER_HOST bash -s << 'ENDSSH'
            cd /opt/appstore || { echo "Path not found"; exit 1; }

            git pull

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose -f docker-compose.yml -f docker-compose.staging.yml pull api celery-worker
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d api celery-worker

            docker compose -f docker-compose.yml -f docker-compose.staging.yml exec -T api alembic upgrade head

            sleep 5
            if ! curl -sf http://localhost:8000/health; then
              echo "Health check failed"
              docker compose -f docker-compose.yml -f docker-compose.staging.yml logs api --tail=50
              exit 1
            fi

            docker image prune -af --filter "until=24h"
          ENDSSH

  deploy-production:
    name: Deploy to Production
    needs: build-and-push
    runs-on: self-hosted
    environment: production
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SERVER_SSH_KEY }}

      - name: Deploy api + celery-worker on Production
        env:
          SERVER_HOST: ${{ secrets.PROD_SERVER_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@$SERVER_HOST bash -s << 'ENDSSH'
            cd /opt/appstore || { echo "Path not found"; exit 1; }

            git pull

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull api celery-worker
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d api celery-worker

            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T api alembic upgrade head

            sleep 5
            if ! curl -sf http://localhost:8000/health; then
              echo "Health check failed"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml logs api --tail=50
              exit 1
            fi

            docker image prune -af --filter "until=24h"
          ENDSSH
