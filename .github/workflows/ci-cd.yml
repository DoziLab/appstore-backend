name: CI/CD Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]
  workflow_dispatch:

jobs:
  check-source-branch:
    name: Only staging can merge into main
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Check source branch
        run: |
          if [ "${{ github.head_ref }}" != "staging" ]; then
            echo "PRs to main are only allowed from 'staging' branch!"
            echo "Current branch: ${{ github.head_ref }}"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Checks
        run: |
          uv run ruff check src/ tests/
          uv run mypy src/
      - name: Tests
        env:
          REDIS_URL: redis://localhost:6379/0
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: test_db
          KEYCLOAK_URL: http://localhost:8080
          KEYCLOAK_REALM: test_realm
          KEYCLOAK_CLIENT_ID: test_client
          ENCRYPTION_KEY: dGVzdGtleXRlc3RrZXl0ZXN0a2V5dGVzdGtleXQ=
        run: uv run pytest tests/ --cov=src --cov-report=xml
      - uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  build-and-push-staging:
    name: Build & Push Staging Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/staging'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/dozilab/appstore-backend:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-prod:
    name: Build & Push Production Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/dozilab/appstore-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push-staging
    runs-on: self-hosted
    environment: staging
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SERVER_SSH_KEY }}

      - name: Sync GitHub App env vars to Staging /opt/appstore/.env
        env:
          SERVER_HOST: ${{ secrets.STAGING_SERVER_HOST }}
          GH_APP_ID: ${{ secrets.STAGING_GITHUB_APP_ID }}
          GH_APP_SLUG: ${{ secrets.STAGING_GITHUB_APP_SLUG }}
          GH_APP_PRIVATE_KEY: ${{ secrets.STAGING_GITHUB_APP_PRIVATE_KEY }}
          GH_APP_STATE_SECRET: ${{ secrets.STAGING_GITHUB_APP_STATE_SECRET }}
          FRONTEND_BASE_URL: ${{ secrets.STAGING_FRONTEND_BASE_URL }}
        run: |
          set -euo pipefail
          umask 077

          # Build the new block locally so the multi-line PEM stays exact;
          # piping it through SSH heredoc would risk shell expansion.
          SNIPPET="$(mktemp)"
          trap 'rm -f "$SNIPPET"' EXIT
          {
            printf '# >>> github-app (managed by ci-cd.yml) >>>\n'
            printf 'GITHUB_APP_ID=%s\n' "$GH_APP_ID"
            printf 'GITHUB_APP_SLUG=%s\n' "$GH_APP_SLUG"
            printf 'GITHUB_APP_STATE_SECRET=%s\n' "$GH_APP_STATE_SECRET"
            printf 'FRONTEND_BASE_URL=%s\n' "$FRONTEND_BASE_URL"
            # PEM contains real newlines — wrap in double quotes so docker-compose
            # / python-dotenv reads it as a single multi-line value.
            printf 'GITHUB_APP_PRIVATE_KEY="%s"\n' "$GH_APP_PRIVATE_KEY"
            printf '# <<< github-app <<<\n'
          } > "$SNIPPET"

          scp -o StrictHostKeyChecking=no "$SNIPPET" ubuntu@$SERVER_HOST:/tmp/appstore-github-env

          ssh -o StrictHostKeyChecking=no ubuntu@$SERVER_HOST bash -s <<'ENDSSH'
            set -euo pipefail
            cd /opt/appstore
            umask 077

            [ -f .env ] || { touch .env; chmod 600 .env; }

            # Drop any prior managed block (delimited by markers); silent no-op
            # if absent. Multi-line PEM is removed cleanly because the delete
            # range is line-based on our markers.
            sed -i '/^# >>> github-app (managed by ci-cd\.yml) >>>$/,/^# <<< github-app <<<$/d' .env

            # Trailing newline before append so we never collide with a
            # non-newline-terminated last line.
            [ -s .env ] && [ "$(tail -c1 .env | wc -l)" -eq 0 ] && printf '\n' >> .env

            cat /tmp/appstore-github-env >> .env
            rm -f /tmp/appstore-github-env
            chmod 600 .env
          ENDSSH

      - name: Deploy api + celery-worker + celery-beat on Staging
        env:
          SERVER_HOST: ${{ secrets.STAGING_SERVER_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@$SERVER_HOST bash -s << 'ENDSSH'
            cd /opt/appstore || { echo "Path not found"; exit 1; }

            git pull

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose -f docker-compose.yml -f docker-compose.staging.yml pull api celery-worker celery-beat
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d api celery-worker celery-beat

            docker compose -f docker-compose.yml -f docker-compose.staging.yml exec -T api alembic upgrade head

            sleep 5
            if ! curl -sf http://localhost:8000/health; then
              echo "Health check failed"
              docker compose -f docker-compose.yml -f docker-compose.staging.yml logs api --tail=50
              exit 1
            fi

            docker image prune -af --filter "until=24h"
          ENDSSH

  deploy-production:
    name: Deploy to Production
    needs: build-and-push-prod
    runs-on: self-hosted
    environment: production
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SERVER_SSH_KEY }}

      - name: Sync GitHub App env vars to Production /opt/appstore/.env
        env:
          SERVER_HOST: ${{ secrets.PROD_SERVER_HOST }}
          GH_APP_ID: ${{ secrets.PROD_GITHUB_APP_ID }}
          GH_APP_SLUG: ${{ secrets.PROD_GITHUB_APP_SLUG }}
          GH_APP_PRIVATE_KEY: ${{ secrets.PROD_GITHUB_APP_PRIVATE_KEY }}
          GH_APP_STATE_SECRET: ${{ secrets.PROD_GITHUB_APP_STATE_SECRET }}
          FRONTEND_BASE_URL: ${{ secrets.PROD_FRONTEND_BASE_URL }}
        run: |
          set -euo pipefail
          umask 077

          # Build the new block locally so the multi-line PEM stays exact;
          # piping it through SSH heredoc would risk shell expansion.
          SNIPPET="$(mktemp)"
          trap 'rm -f "$SNIPPET"' EXIT
          {
            printf '# >>> github-app (managed by ci-cd.yml) >>>\n'
            printf 'GITHUB_APP_ID=%s\n' "$GH_APP_ID"
            printf 'GITHUB_APP_SLUG=%s\n' "$GH_APP_SLUG"
            printf 'GITHUB_APP_STATE_SECRET=%s\n' "$GH_APP_STATE_SECRET"
            printf 'FRONTEND_BASE_URL=%s\n' "$FRONTEND_BASE_URL"
            # PEM contains real newlines — wrap in double quotes so docker-compose
            # / python-dotenv reads it as a single multi-line value.
            printf 'GITHUB_APP_PRIVATE_KEY="%s"\n' "$GH_APP_PRIVATE_KEY"
            printf '# <<< github-app <<<\n'
          } > "$SNIPPET"

          scp -o StrictHostKeyChecking=no "$SNIPPET" ubuntu@$SERVER_HOST:/tmp/appstore-github-env

          ssh -o StrictHostKeyChecking=no ubuntu@$SERVER_HOST bash -s <<'ENDSSH'
            set -euo pipefail
            cd /opt/appstore
            umask 077

            [ -f .env ] || { touch .env; chmod 600 .env; }

            # Drop any prior managed block (delimited by markers); silent no-op
            # if absent. Multi-line PEM is removed cleanly because the delete
            # range is line-based on our markers.
            sed -i '/^# >>> github-app (managed by ci-cd\.yml) >>>$/,/^# <<< github-app <<<$/d' .env

            # Trailing newline before append so we never collide with a
            # non-newline-terminated last line.
            [ -s .env ] && [ "$(tail -c1 .env | wc -l)" -eq 0 ] && printf '\n' >> .env

            cat /tmp/appstore-github-env >> .env
            rm -f /tmp/appstore-github-env
            chmod 600 .env
          ENDSSH

      - name: Deploy api + celery-worker + celery-beat on Production
        env:
          SERVER_HOST: ${{ secrets.PROD_SERVER_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@$SERVER_HOST bash -s << 'ENDSSH'
            cd /opt/appstore || { echo "Path not found"; exit 1; }

            git pull

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull api celery-worker celery-beat
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d api celery-worker celery-beat

            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T api alembic upgrade head

            sleep 5
            if ! curl -sf http://localhost:8000/health; then
              echo "Health check failed"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml logs api --tail=50
              exit 1
            fi

            docker image prune -af --filter "until=24h"
          ENDSSH
